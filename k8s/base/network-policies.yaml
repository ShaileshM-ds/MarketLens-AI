# Requires a CNI that enforces NetworkPolicy. Outbound traffic is not restricted.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mongo-internal-only
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: marketlens-ai
      app.kubernetes.io/component: mongo
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: marketlens-ai
          app.kubernetes.io/component: backend
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: marketlens-ai
          app.kubernetes.io/component: worker
    ports:
    - protocol: TCP
      port: 27017
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker-no-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: marketlens-ai
      app.kubernetes.io/component: worker
  policyTypes:
  - Ingress
  ingress: []
