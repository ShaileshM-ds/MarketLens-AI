# Uses your cluster default IngressClass. Set spec.ingressClassName if there is no default.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: marketlens
spec:
  rules:
  - host: marketlens.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
      - path: /docs
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
      - path: /openapi.json
        pathType: Exact
        backend:
          service:
            name: backend
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
