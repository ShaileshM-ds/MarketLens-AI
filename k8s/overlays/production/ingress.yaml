apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: marketlens
spec:
  tls:
  - hosts:
    - marketlens.example.com
    secretName: marketlens-tls
  rules:
  - host: marketlens.example.com
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
      - path: /docs
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000
      - path: /openapi.json
        pathType: Exact
        backend:
          service:
            name: backend
            port:
              number: 8000
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 80
