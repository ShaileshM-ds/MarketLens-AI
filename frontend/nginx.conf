server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 8m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'" always;
  location /api/ { proxy_pass http://backend:8000; proxy_read_timeout 120s; }
  location /docs { proxy_pass http://backend:8000; }
  location /openapi.json { proxy_pass http://backend:8000; }
  location / { try_files $uri $uri/ /index.html; }
}
