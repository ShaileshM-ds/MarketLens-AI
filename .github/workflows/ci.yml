name: verify-build-deploy
on: [push, pull_request, workflow_dispatch]
jobs:
  full-stack:
    runs-on: [self-hosted, windows, x64]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      MONGO_CONTAINER: marketlens-mongo-${{ github.run_id }}-${{ github.run_attempt }}
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start MongoDB
        shell: powershell
        run: |
          docker run --detach --publish 127.0.0.1::27017 --name $env:MONGO_CONTAINER mongo:8.0
          if ($LASTEXITCODE -ne 0) {
            throw "Could not start the MongoDB test container."
          }
          $publishedPort = docker port $env:MONGO_CONTAINER 27017/tcp
          if ($LASTEXITCODE -ne 0 -or -not $publishedPort) {
            throw "Could not determine the MongoDB test container's host port."
          }
          $port = ($publishedPort.Trim() -split ':')[-1]
          if ($port -notmatch '^\d+$') {
            throw "Docker returned an invalid MongoDB host port: '$publishedPort'."
          }
          [System.IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "MONGO_URI=mongodb://127.0.0.1:$port`n",
            [System.Text.UTF8Encoding]::new($false)
          )
      - name: Wait for MongoDB
        shell: powershell
        run: |
          for ($i = 0; $i -lt 30; $i++) {
            docker exec $env:MONGO_CONTAINER mongosh --quiet --eval "db.adminCommand('ping').ok" 2>$null
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            Start-Sleep -Seconds 2
          }
          throw "MongoDB did not become ready in 60 seconds."
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Test backend
        run: pytest backend/tests -q
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - uses: docker/setup-buildx-action@v3
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      - name: Build and load backend image
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          tags: marketlens-ai-backend:sha-${{ github.sha }}
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build and load frontend image
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          tags: marketlens-ai-frontend:sha-${{ github.sha }}
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Deploy to Docker Desktop Kubernetes
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: powershell
        run: |
          $context = kubectl config current-context
          if ($LASTEXITCODE -ne 0 -or $context -ne 'docker-desktop') {
            throw "Expected kubectl context 'docker-desktop', got '$context'."
          }

          kubectl -n marketlens-ai get secret marketlens-secrets
          if ($LASTEXITCODE -ne 0) {
            throw "Create the marketlens-secrets Secret in namespace marketlens-ai before deploying."
          }

          $tag = "sha-$env:GITHUB_SHA"
          $rendered = kubectl kustomize k8s
          if ($LASTEXITCODE -ne 0) {
            throw "Could not render the Kubernetes manifests."
          }
          $manifest = [string]::Join("`n", $rendered)
          if (-not $manifest.Contains('marketlens-ai-backend:k8s-local') -or
              -not $manifest.Contains('marketlens-ai-frontend:k8s-local')) {
            throw "The local Kustomize overlay does not contain the expected image tags."
          }
          $manifest = $manifest.Replace('marketlens-ai-backend:k8s-local', "marketlens-ai-backend:$tag")
          $manifest = $manifest.Replace('marketlens-ai-frontend:k8s-local', "marketlens-ai-frontend:$tag")
          $manifestPath = Join-Path $env:RUNNER_TEMP "marketlens-$env:GITHUB_RUN_ID.yaml"
          Set-Content -Path $manifestPath -Value $manifest -Encoding utf8

          kubectl apply --dry-run=server --filename $manifestPath
          if ($LASTEXITCODE -ne 0) {
            throw "Kubernetes server-side validation failed."
          }
          kubectl apply --filename $manifestPath
          if ($LASTEXITCODE -ne 0) {
            throw "Applying the Kubernetes manifests failed."
          }
          kubectl -n marketlens-ai rollout status statefulset/mongo --timeout=300s
          if ($LASTEXITCODE -ne 0) {
            throw "MongoDB rollout did not complete."
          }
          kubectl -n marketlens-ai rollout status deployment/backend --timeout=900s
          if ($LASTEXITCODE -ne 0) {
            throw "Backend rollout did not complete."
          }
          kubectl -n marketlens-ai rollout status deployment/worker --timeout=300s
          if ($LASTEXITCODE -ne 0) {
            throw "Worker rollout did not complete."
          }
          kubectl -n marketlens-ai rollout status deployment/frontend --timeout=300s
          if ($LASTEXITCODE -ne 0) {
            throw "Frontend rollout did not complete."
          }
      - name: Remove MongoDB test container
        if: always()
        shell: powershell
        run: |
          docker rm --force $env:MONGO_CONTAINER
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Could not remove MongoDB test container '$env:MONGO_CONTAINER'."
          }
