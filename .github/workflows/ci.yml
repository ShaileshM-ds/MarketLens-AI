name: CI-CD Kubernetes

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  K8S_NAMESPACE: marketlens-ai

jobs:
  test-and-build-app:
    name: Test full-stack application
    runs-on: [self-hosted, windows, x64]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      MONGO_CONTAINER: marketlens-mongo-${{ github.run_id }}-${{ github.run_attempt }}
      MONGO_NETWORK: marketlens-test-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start MongoDB
        shell: powershell
        run: |
          docker network create $env:MONGO_NETWORK
          if ($LASTEXITCODE -ne 0) {
            throw "Could not create the backend test Docker network."
          }
          docker run --detach --network $env:MONGO_NETWORK --network-alias mongo --name $env:MONGO_CONTAINER mongo:8.0
          if ($LASTEXITCODE -ne 0) {
            throw "Could not start the MongoDB test container."
          }

      - name: Wait for MongoDB
        shell: powershell
        run: |
          for ($i = 0; $i -lt 30; $i++) {
            docker exec $env:MONGO_CONTAINER mongosh --quiet --eval "db.adminCommand('ping').ok" 2>$null
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            Start-Sleep -Seconds 2
          }
          throw "MongoDB did not become ready in 60 seconds."

      - name: Install dependencies and run backend tests
        shell: powershell
        run: |
          $workspace = $env:GITHUB_WORKSPACE
          docker run --rm --network $env:MONGO_NETWORK `
            --env MONGO_URI=mongodb://mongo:27017 `
            --env PYTHONPATH=backend `
            --volume "${workspace}:/workspace" `
            --workdir /workspace `
            python:3.13-slim `
            sh -c "python -m pip install --disable-pip-version-check -r backend/requirements.lock && python -m pytest backend/tests -q"
          if ($LASTEXITCODE -ne 0) {
            throw "Backend dependency installation or tests failed in the Python container."
          }

      - name: Install frontend dependencies
        working-directory: frontend
        shell: powershell
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        shell: powershell
        run: npm test

      - name: Build frontend
        working-directory: frontend
        shell: powershell
        run: npm run build

      - name: Remove MongoDB test container
        if: always()
        shell: powershell
        run: |
          docker rm --force $env:MONGO_CONTAINER
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Could not remove MongoDB test container '$env:MONGO_CONTAINER'."
          }
          docker network rm $env:MONGO_NETWORK
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Could not remove backend test network '$env:MONGO_NETWORK'."
          }

  build-and-save-images:
    name: Build application images
    needs: test-and-build-app
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, windows, x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and save images
        shell: powershell
        run: |
          $imageDir = Join-Path $env:RUNNER_TEMP "marketlens-images"
          New-Item -ItemType Directory -Path $imageDir -Force | Out-Null
          $tag = "sha-$env:GITHUB_SHA"

          docker build --tag "marketlens-ai-backend:$tag" --file backend/Dockerfile .
          if ($LASTEXITCODE -ne 0) {
            throw "Backend image build failed."
          }
          docker build --tag "marketlens-ai-frontend:$tag" --file frontend/Dockerfile .
          if ($LASTEXITCODE -ne 0) {
            throw "Frontend image build failed."
          }

          docker save --output (Join-Path $imageDir "backend.tar") "marketlens-ai-backend:$tag"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not export the backend image."
          }
          docker save --output (Join-Path $imageDir "frontend.tar") "marketlens-ai-frontend:$tag"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not export the frontend image."
          }

      - name: Upload images for deployment
        uses: actions/upload-artifact@v4
        with:
          name: marketlens-images-${{ github.sha }}
          path: ${{ runner.temp }}\marketlens-images\*.tar
          if-no-files-found: error
          retention-days: 1

  deploy-to-kubernetes:
    name: Deploy to Docker Desktop Kubernetes
    needs: build-and-save-images
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, windows, x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built images
        uses: actions/download-artifact@v4
        with:
          name: marketlens-images-${{ github.sha }}
          path: ${{ runner.temp }}\marketlens-images

      - name: Load images into local Docker
        shell: powershell
        run: |
          docker load --input (Join-Path $env:RUNNER_TEMP "marketlens-images\backend.tar")
          if ($LASTEXITCODE -ne 0) {
            throw "Could not load the backend image into Docker."
          }
          docker load --input (Join-Path $env:RUNNER_TEMP "marketlens-images\frontend.tar")
          if ($LASTEXITCODE -ne 0) {
            throw "Could not load the frontend image into Docker."
          }

      - name: Verify Kubernetes context and application secret
        shell: powershell
        run: |
          $context = kubectl config current-context
          if ($LASTEXITCODE -ne 0 -or $context -ne 'docker-desktop') {
            throw "Expected kubectl context 'docker-desktop', got '$context'."
          }

          kubectl apply -f k8s/base/namespace.yaml
          if ($LASTEXITCODE -ne 0) {
            throw "Could not create the $env:K8S_NAMESPACE namespace."
          }

          kubectl -n $env:K8S_NAMESPACE get secret marketlens-secrets
          if ($LASTEXITCODE -ne 0) {
            throw "Create the marketlens-secrets Secret in namespace $env:K8S_NAMESPACE before deploying."
          }

      - name: Apply Kubernetes manifests
        shell: powershell
        run: |
          $tag = "sha-$env:GITHUB_SHA"
          $rendered = kubectl kustomize k8s
          if ($LASTEXITCODE -ne 0) {
            throw "Could not render the Kubernetes manifests."
          }
          $manifest = [string]::Join("`n", $rendered)
          if (-not $manifest.Contains('marketlens-ai-backend:k8s-local') -or
              -not $manifest.Contains('marketlens-ai-frontend:k8s-local')) {
            throw "The local Kustomize overlay does not contain the expected image tags."
          }
          $manifest = $manifest.Replace('marketlens-ai-backend:k8s-local', "marketlens-ai-backend:$tag")
          $manifest = $manifest.Replace('marketlens-ai-frontend:k8s-local', "marketlens-ai-frontend:$tag")
          $manifestPath = Join-Path $env:RUNNER_TEMP "marketlens-$env:GITHUB_RUN_ID.yaml"
          [System.IO.File]::WriteAllText(
            $manifestPath,
            $manifest,
            [System.Text.UTF8Encoding]::new($false)
          )

          kubectl apply --dry-run=server --filename $manifestPath
          if ($LASTEXITCODE -ne 0) {
            throw "Kubernetes server-side validation failed."
          }
          kubectl apply --filename $manifestPath
          if ($LASTEXITCODE -ne 0) {
            throw "Applying the Kubernetes manifests failed."
          }

      - name: Wait for application rollouts
        shell: powershell
        run: |
          $rollouts = @(
            @{ Resource = 'statefulset/mongo'; Timeout = '300s' },
            @{ Resource = 'deployment/backend'; Timeout = '900s' },
            @{ Resource = 'deployment/worker'; Timeout = '300s' },
            @{ Resource = 'deployment/frontend'; Timeout = '300s' }
          )
          foreach ($rollout in $rollouts) {
            kubectl -n $env:K8S_NAMESPACE rollout status $rollout.Resource "--timeout=$($rollout.Timeout)"
            if ($LASTEXITCODE -ne 0) {
              throw "Rollout failed for $($rollout.Resource)."
            }
          }

      - name: Deployment snapshot
        if: always()
        shell: powershell
        run: kubectl -n $env:K8S_NAMESPACE get deployments,pods,services,ingress,pvc
